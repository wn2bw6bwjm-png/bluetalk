# Builds an installable Android APK and an UNSIGNED iOS app on GitHub-hosted
# runners. Run it from the "Actions" tab (workflow_dispatch) or push a tag.
#
# Notes
#  * The android/ and ios/ folders are generated by tool/bootstrap_app.sh
#    (they are not committed), so every job runs it first.
#  * The APK is signed with Flutter's DEBUG key: fine for installing on your
#    own phones, not for the Play Store.
#  * The iOS result is NOT signed (no Apple account is available to CI). It
#    cannot be installed as-is; see "iOS signing" in README.
#  * Neither job has ever been run: the first run may reveal build errors.
name: build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Install SQLite with FTS5 (used by the engine tests)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: bash tool/run_all_tests.sh

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/bootstrap_app.sh
      - name: Build release APK
        working-directory: app
        run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/build/app/outputs/flutter-apk/*.apk

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/bootstrap_app.sh
      - name: Build iOS (no code signing)
        working-directory: app
        run: flutter build ios --release --no-codesign
      - name: Package unsigned .ipa
        working-directory: app
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr bluetalk-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: app/bluetalk-unsigned.ipa
